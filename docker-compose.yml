services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proplink_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      # Database connection configuration (Supabase PostgreSQL)
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSLMODE=${DB_SSLMODE:-Require}
      # Cloudinary Configuration
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
      # Supabase Storage Configuration
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
    volumes:
      # Persist ASP.NET Core Data Protection keys across container restarts (preserves user login cookies)
      - dp-keys:/root/.aspnet/DataProtection-Keys

volumes:
  dp-keys:
    name: proplink_dp_keys
