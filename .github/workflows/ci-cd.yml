# ==============================================================================
# PropLink CI/CD Pipeline (GitHub Actions)
# ==============================================================================
# Triggers:
#   - Pull Requests to 'main': Restores, compiles .NET 10 solution, runs tests,
#     and verifies that the Docker container builds without errors.
#   - Push to 'main' & manual dispatch: Runs validation gates, builds and pushes
#     the production Docker image to GitHub Container Registry (ghcr.io),
#     and automatically triggers deployment on Render via Deploy Hook.
# ==============================================================================

name: PropLink CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ----------------------------------------------------------------------------
  # 1. Build and Test Gate (.NET 10)
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore NuGet Dependencies
        run: dotnet restore PropLink.csproj

      - name: Build Project (Release)
        run: dotnet build PropLink.csproj --configuration Release --no-restore

      - name: Run Tests (if test projects exist)
        run: |
          if ls tests/**/*.csproj 1> /dev/null 2>&1 || ls **/*Test*.csproj 1> /dev/null 2>&1; then
            echo "Running test suite..."
            dotnet test --configuration Release --no-build --verbosity normal
          else
            echo "No dedicated test project found. Skipping test execution."
          fi

  # ----------------------------------------------------------------------------
  # 2. Build & Push Docker Image (GHCR)
  # ----------------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 3. Deploy to Render
  # ----------------------------------------------------------------------------
  deploy-to-render:
    name: Trigger Render Deployment
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL is not set in GitHub Repository Secrets. Skipping Render webhook trigger."
            echo "To enable automatic deployment, create a Deploy Hook in Render (Service Settings -> Deploy Hook) and add it as a secret named RENDER_DEPLOY_HOOK_URL in your GitHub repository."
          else
            echo "Triggering Render deployment..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment triggered successfully (HTTP $HTTP_STATUS)!"
              echo "Response: $BODY"
            else
              echo "::error ::Failed to trigger Render deployment (HTTP $HTTP_STATUS)"
              echo "Response: $BODY"
              exit 1
            fi
          fi
